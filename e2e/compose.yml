name: evidence-e2e
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: evidence_test
      POSTGRES_PASSWORD: evidence_test
      POSTGRES_DB: evidence_e2e
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence_test -d evidence_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20
